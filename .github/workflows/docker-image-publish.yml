name: Build & Publish Docker Image

on:
  push:
    branches:
    - main
  workflow_dispatch:

env:
  DEV: ${{ (github.ref != '' && github.ref || github.event.ref) != 'refs/heads/main' && '-dev' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Azure Container Registry Login
      uses: docker/login-action@v3
      with:
        # Container registry username
        username: ${{ secrets.SAMPLEAPP_ACR_USERNAME }}
        # Container registry password
        password: ${{ secrets.SAMPLEAPP_ACR_PASSWORD }}
    - uses: actions/checkout@v3
    - name: Build the Docker image
      env:
        NODE_ENV: ${{ env.DEV == '' && 'production' || 'development' }}
      run:
        echo "DEV:$DEV, NODE_ENV:$NODE_ENV";
        docker build . --file WebApp.Dockerfile --build-arg DEV=$DEV --tag eschweighofer/sample-app-aoai-chatgpt:$(date +'%Y-%m-%d')_$GITHUB_RUN_NUMBER$DEV;
    - name: Tag and Push the Docker image
      run:
        docker tag eschweighofer/sample-app-aoai-chatgpt:$(date +'%Y-%m-%d')_$GITHUB_RUN_NUMBER$DEV eschweighofer/sample-app-aoai-chatgpt:latest$DEV;
        docker push eschweighofer/sample-app-aoai-chatgpt:$(date +'%Y-%m-%d')_$GITHUB_RUN_NUMBER$DEV;
        docker push eschweighofer/sample-app-aoai-chatgpt:latest$DEV;
