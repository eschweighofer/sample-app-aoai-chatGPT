name: Docker Image Publish

on:
  push:
    branches:
    - main
    - WebApp-only
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      DEV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && 'false' || 'true' }}

    steps:
    - name: Azure Container Registry Login
      uses: docker/login-action@v3
      with:
        # Container registry username
        username: ${{ secrets.SAMPLEAPP_ACR_USERNAME }}
        # Container registry password
        password: ${{ secrets.SAMPLEAPP_ACR_PASSWORD }}
        
    - uses: actions/checkout@v3

    - name: Build the Docker image
      env:
        TAG_DEV: ${{ env.DEV && '-dev' || '' }}
      run:
        docker build . --file WebApp.Dockerfile --tag eschweighofer/sample-app-aoai-chatgpt:$(date +'%Y-%m-%d')_$GITHUB_RUN_NUMBER${TAG_DEV};

    - name: Tag and Push the Docker image
      env:
        TAG_DEV: ${{ env.DEV && '-dev' || '' }}
      run:
        docker tag eschweighofer/sample-app-aoai-chatgpt:$(date +'%Y-%m-%d')_$GITHUB_RUN_NUMBER${TAG_DEV} eschweighofer/sample-app-aoai-chatgpt:latest${TAG_DEV};
        docker push eschweighofer/sample-app-aoai-chatgpt:$(date +'%Y-%m-%d')_$GITHUB_RUN_NUMBER${TAG_DEV};
        docker push eschweighofer/sample-app-aoai-chatgpt:latest${TAG_DEV};
